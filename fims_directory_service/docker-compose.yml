version: '3.9'

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "9001:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: "your-secret-key-change-in-production"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DB_HOST: "host.docker.internal"
    stdin_open: true
    tty: true
